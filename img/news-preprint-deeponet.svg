<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 300"
     width="100%"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-label="arXiv preprint preview: A Full-field Extended Deep Operator Network as a Spatio-temporal Surrogate for Structural Dynamics."
     font-family="Barlow, Inter, Helvetica, sans-serif">
  <defs>
    <style>
      .page    { fill: #ffffff; stroke: #d6d8dc; stroke-width: 1; }
      .arxivR  { fill: #b31b1b; }                       /* arXiv / Cornell red */
      .arxivW  { font-size: 36px; font-weight: 700; letter-spacing: -0.01em; }
      .arxivAcc{ fill: #1f1f1f; }
      .meta    { font-size: 12px; font-weight: 500; fill: #5b6671; }
      .id      { font-size: 13px; font-weight: 600; fill: #b31b1b; font-family: 'Roboto Mono', Menlo, Consolas, monospace; }
      .title   { font-size: 14px; font-weight: 600; fill: #0c2340; }
      .author  { font-size: 11px; font-weight: 400; fill: #2d3a4a; }
      .rule    { stroke: #e3e3e3; stroke-width: 1; }
      .pillBg  { fill: #fef3c7; stroke: #92400e; stroke-width: 1; }
      .pillT   { font-size: 10px; font-weight: 600; fill: #92400e; letter-spacing: 0.05em; }
    </style>
  </defs>

  <!-- Paper background -->
  <rect x="20" y="20" width="360" height="260" rx="3" class="page"/>

  <!-- arXiv wordmark: red 'ar', dark 'X', red 'iv' is actually all-red in their official mark.
       We use the simplified all-red wordmark with a stylized 'X' to evoke the brand without
       copying the trademarked logotype. -->
  <text x="40" y="78" class="arxivW arxivR">ar<tspan class="arxivAcc">X</tspan>iv</text>

  <!-- Preprint identifier -->
  <text x="40" y="104" class="id">arXiv:2506.XXXXX [cs.CE]</text>
  <text x="40" y="122" class="meta">cs.CE — Computational Engineering · Submitted June 2025</text>

  <line x1="40" y1="138" x2="360" y2="138" class="rule"/>

  <!-- Paper title -->
  <text x="40" y="162" class="title">A Full-field Extended Deep Operator</text>
  <text x="40" y="181" class="title">Network as a Spatio-temporal Surrogate</text>
  <text x="40" y="200" class="title">for Structural Dynamics</text>

  <!-- Author line -->
  <text x="40" y="226" class="author">Jichuan Tang, Ryan G. McClarren,</text>
  <text x="40" y="241" class="author">Charles Sweet, Patrick T. Brewick</text>

  <!-- Status pill -->
  <rect x="40" y="255" width="100" height="20" rx="10" class="pillBg"/>
  <text x="90" y="269" class="pillT" text-anchor="middle">UNDER REVIEW</text>
</svg>
